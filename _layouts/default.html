<!-- Hero Section -->
<section class="hero" id="search">
  <div class="hero-content">
    <h1>Hikaru's Blog</h1>
    <p class="hero-subtitle" id="rotating-subtitle"></p>
  </div>
</section>

<script>
  const lines = [
    "Suffering is the price of freedom",
    "Code. Learn. Share.",
    "Stay hungry, stay foolish.",
    "向光而行，步履不停。"
  ];

  const el = document.getElementById("rotating-subtitle");
  let i = 0;

  function playLine(text) {
    el.classList.remove("fade-out-right");
    el.textContent = text;

    // 触发重排，让动画可重复播放
    void el.offsetWidth;

    el.classList.add("fade-in");

    setTimeout(() => {
      el.classList.remove("fade-in");
      el.classList.add("fade-out-right");
    }, 2200);
  }

  function loop() {
    playLine(lines[i]);
    i = (i + 1) % lines.length;
    setTimeout(loop, 3200);
  }

  loop();
</script>
